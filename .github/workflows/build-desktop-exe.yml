name: Build Desktop App (Windows exe)

on:
  push:
    branches: ["claude/epc-planning-desktop-app-ih4njp", "main"]
    paths:
      - "desktop/**"
      - ".github/workflows/build-desktop-exe.yml"
  workflow_dispatch:

jobs:
  # Fast, cheap headless validation on Linux before we spend Windows minutes.
  smoke-linux:
    name: Headless smoke test (Linux)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: System libraries for offscreen Qt
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libdbus-1-3 \
            libfontconfig1 libfreetype6 libglib2.0-0
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run headless smoke test
        env:
          QT_QPA_PLATFORM: offscreen
        run: python tests/smoke_test.py

  build-windows:
    name: PyInstaller portable exe (Windows)
    needs: smoke-linux
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Headless smoke test (Windows)
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
        run: python tests/smoke_test.py
      - name: Build single-file executable
        run: pyinstaller build/app.spec
      - name: Upload portable exe
        uses: actions/upload-artifact@v4
        with:
          name: CommissioningManagementSuite-windows-exe
          path: desktop/dist/CommissioningManagementSuite.exe
          retention-days: 90
