name: SV Wedding Planner (Flutter)

on:
  push:
    branches: ["**"]
    paths:
      - "sv_wedding_planner/**"
      - ".github/workflows/sv-wedding-planner.yml"
  pull_request:
    paths:
      - "sv_wedding_planner/**"

permissions:
  contents: write

defaults:
  run:
    working-directory: sv_wedding_planner

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # Generate android / ios / web platform folders (kept out of git) so the
      # app builds on any machine, then fetch packages.
      - name: Bootstrap platforms
        run: flutter create --platforms=android,ios,web --project-name sv_wedding_planner --org com.svwedding .

      - name: Install dependencies
        run: flutter pub get

      - name: Generate launcher icons from logo
        run: dart run flutter_launcher_icons

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Test
        run: flutter test

      - name: Build Android APK
        run: flutter build apk --release

      - name: Build web
        run: flutter build web --release

      - name: Rename APK
        run: cp build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/sv-wedding-planner.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: sv-wedding-planner-apk
          path: sv_wedding_planner/build/app/outputs/flutter-apk/sv-wedding-planner.apk
          if-no-files-found: warn

      # Publish the APK as a GitHub Release asset so it has a stable, public,
      # direct-download link (no GitHub login required).
      - name: Publish APK to Releases
        if: github.ref == 'refs/heads/claude/sv-wedding-planner-app-stf10m' || github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: wedding-app-latest
          name: SV Wedding Planner — latest build
          body: |
            Latest builds of the SV Wedding Planner app.
            - Android: install `sv-wedding-planner.apk` (enable "install from unknown sources").
            - iOS: `sv-wedding-planner-unsigned.ipa` is UNSIGNED — sideload it with
              AltStore / Sideloadly / Xcode using your own Apple ID (App Store /
              TestFlight distribution needs an Apple Developer account).
            Rebuilt automatically on each push.
          prerelease: true
          files: sv_wedding_planner/build/app/outputs/flutter-apk/sv-wedding-planner.apk

  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Bootstrap platforms
        run: flutter create --platforms=ios,android,web --project-name sv_wedding_planner --org com.svwedding .
      - name: Install dependencies
        run: flutter pub get
      - name: Generate launcher icons from logo
        run: dart run flutter_launcher_icons
      - name: Build iOS (unsigned)
        run: flutter build ios --release --no-codesign
      - name: Package unsigned IPA
        run: |
          cd build/ios/iphoneos
          mkdir -p Payload
          cp -r Runner.app Payload/
          zip -qr sv-wedding-planner-unsigned.ipa Payload
      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: sv-wedding-planner-ipa
          path: sv_wedding_planner/build/ios/iphoneos/sv-wedding-planner-unsigned.ipa
          if-no-files-found: warn
      - name: Publish IPA to Releases
        if: github.ref == 'refs/heads/claude/sv-wedding-planner-app-stf10m' || github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: wedding-app-latest
          prerelease: true
          files: sv_wedding_planner/build/ios/iphoneos/sv-wedding-planner-unsigned.ipa
