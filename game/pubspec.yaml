name: shefali
description: "Prakriti Ki Rakshak: Shefali — a 2D environmentalist platformer (Flutter + Flame)."
publish_to: "none"
version: 0.1.0+1

# withValues(...) and recent Flame APIs are used, so a recent stable Flutter is
# required. If you must target an older Flutter, replace Color.withValues(alpha:)
# with Color.withOpacity() throughout and relax these constraints.
environment:
  sdk: ">=3.6.0 <4.0.0"
  flutter: ">=3.27.0"

dependencies:
  flutter:
    sdk: flutter
  flame: ^1.18.0
  audioplayers: ^6.1.0
  shared_preferences: ^2.3.0
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/config/
    - assets/config/levels/
    - assets/sprites/shefali/
    - assets/sprites/enemies/
    - assets/sprites/pickups/
    - assets/sprites/env/
    - assets/sprites/npc/
    - assets/audio/sfx/
    - assets/audio/ambient/
    - assets/audio/music/
    - assets/audio/voice/shefali/
    - assets/audio/voice/litterer/
    - assets/audio/voice/vaishnav/
    - assets/audio/voice/chai_uncle/
