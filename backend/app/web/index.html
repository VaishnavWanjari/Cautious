<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>GPT-3/4 Gas Processing Train — Pre-Commissioning Tracker & Visualizer</title>
<style>
  :root { --epc:#1F4E78; --epc-dark:#0f2a43; --crit:#e4572e; }
  * { box-sizing: border-box; }
  body { margin:0; font-family:"Segoe UI",system-ui,Arial,sans-serif; background:#f3f5f8; color:#1f2933; }
  .app { display:flex; height:100vh; }
  aside { width:212px; background:var(--epc-dark); color:#fff; display:flex; flex-direction:column; }
  aside .brand { padding:14px 16px; border-bottom:1px solid rgba(255,255,255,.1); }
  aside .brand b { display:block; font-size:13px; line-height:1.25; }
  aside .brand small { color:rgba(255,255,255,.55); font-size:10px; letter-spacing:.4px; text-transform:uppercase; display:block; margin-top:3px; }
  nav button { width:100%; text-align:left; background:none; border:0; color:rgba(255,255,255,.72);
    padding:10px 16px; font-size:13px; cursor:pointer; }
  nav button:hover { background:rgba(255,255,255,.06); }
  nav button.active { background:var(--epc); color:#fff; }
  aside .foot { margin-top:auto; padding:12px 16px; font-size:11px; color:rgba(255,255,255,.5); border-top:1px solid rgba(255,255,255,.1); }
  main { flex:1; display:flex; flex-direction:column; min-width:0; }
  header { min-height:54px; background:#fff; border-bottom:1px solid #e2e8f0; display:flex; align-items:center; padding:8px 18px; gap:12px; flex-wrap:wrap; }
  header .title { font-weight:700; color:#1f2933; font-size:15px; }
  header .sub { color:#64748b; font-size:12px; }
  header .spacer { flex:1; }
  label.pmcc { font-size:12px; color:#475569; display:flex; align-items:center; gap:6px; }
  .btn { background:var(--epc); color:#fff; border:0; border-radius:6px; padding:7px 12px; font-size:13px; cursor:pointer; }
  .btn:hover { background:#163a5a; }
  .btn.ghost { background:#eef2f7; color:#334155; }
  select,input { border:1px solid #cbd5e1; border-radius:6px; padding:6px 8px; font-size:13px; }
  section.view { flex:1; overflow:auto; padding:18px; }
  .cards { display:flex; gap:12px; flex-wrap:wrap; margin-bottom:16px; }
  .card { background:#fff; border:1px solid #eef0f3; border-radius:12px; padding:13px 17px; min-width:115px; box-shadow:0 1px 3px rgba(0,0,0,.05); }
  .card .num { font-size:26px; font-weight:700; color:var(--epc); }
  .card .num.crit { color:var(--crit); }
  .card .lbl { font-size:10px; text-transform:uppercase; letter-spacing:.5px; color:#64748b; }
  table { width:100%; border-collapse:collapse; background:#fff; border-radius:10px; overflow:hidden; box-shadow:0 1px 3px rgba(0,0,0,.05); }
  th { background:#f1f5f9; color:#475569; text-align:left; padding:8px 11px; font-size:11px; text-transform:uppercase; letter-spacing:.3px; }
  td { padding:7px 11px; border-top:1px solid #f1f5f9; font-size:12.5px; }
  tr.crit td { background:#fff3ee; }
  tr.clickable { cursor:pointer; } tr.clickable:hover td { background:#eef4fb; }
  .dot { color:var(--crit); }
  .pill { font-size:10px; padding:1px 7px; border-radius:10px; color:#fff; }
  .p-A,.p-A1 { background:#c2410c; } .p-B,.p-B1 { background:#1F4E78; } .p-C,.p-C1 { background:#64748b; }
  .cat { font-size:10px; padding:1px 6px; border-radius:4px; background:#e7eef5; color:#1F4E78; }
  .panel { background:#fff; border:1px solid #eef0f3; border-radius:12px; padding:14px; box-shadow:0 1px 3px rgba(0,0,0,.05); margin-bottom:14px; }
  .row { display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
  .muted { color:#94a3b8; font-size:12px; }
  h1 { font-size:17px; margin:0 0 4px; color:#334155; }
  h2 { font-size:13px; margin:0 0 8px; color:#475569; }
  .warn { color:#b45309; font-size:12px; } .err { color:#dc2626; font-size:12px; }
  .gantt-row { display:flex; align-items:center; height:26px; border-top:1px solid #f4f6f9; }
  .gantt-label { width:230px; font-size:11px; padding-left:8px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .gantt-track { position:relative; flex:1; height:100%; }
  .gantt-bar { position:absolute; top:5px; height:16px; border-radius:3px; background:var(--epc); color:#fff; font-size:9px; display:flex; align-items:center; padding:0 5px; }
  .gantt-bar.crit { background:var(--crit); }
  .msg { max-width:78%; padding:8px 11px; border-radius:9px; font-size:13px; margin:5px 0; white-space:pre-wrap; }
  .msg.user { background:var(--epc); color:#fff; margin-left:auto; }
  .msg.ai { background:#eef2f7; }
  svg text { font-family:inherit; }
  .hint { background:#fff8ed; border:1px solid #fde6c4; color:#92702a; border-radius:10px; padding:14px; font-size:13px; }
  /* timeline */
  .tl-wrap { position:relative; overflow:auto; max-height:74vh; border:1px solid #eef0f3; border-radius:12px; background:#fff; user-select:none; }
  .tl-grid { position:relative; }
  .tl-head { position:sticky; top:0; z-index:6; height:34px; background:#f8fafc; border-bottom:1px solid #e2e8f0; }
  .tl-month { position:absolute; top:0; height:34px; border-left:1px solid #e2e8f0; font-size:10px; color:#475569; padding:3px 0 0 4px; white-space:nowrap; }
  .tl-week { position:absolute; top:0; bottom:0; border-left:1px solid #f1f5f9; }
  .tl-row { position:relative; height:28px; border-top:1px solid #f4f6f9; }
  .tl-row.sub { height:23px; background:#fafbfc; }
  .tl-lab { position:sticky; left:0; z-index:5; width:250px; height:100%; display:inline-flex; align-items:center; gap:6px; background:#fff; border-right:1px solid #eef0f3; font-size:11px; padding-left:8px; white-space:nowrap; overflow:hidden; cursor:pointer; }
  .tl-row.sub .tl-lab { background:#fafbfc; cursor:default; padding-left:16px; }
  .tl-lab.crit { background:#fff3ee; } .tl-row.sub .tl-lab.crit{ background:#fff3ee; }
  .tl-caret { display:inline-block; width:11px; color:#94a3b8; font-size:9px; }
  .tl-bar { position:absolute; top:5px; height:18px; border-radius:4px; background:var(--epc); color:#fff; font-size:9.5px; line-height:18px; padding:0 6px; overflow:hidden; white-space:nowrap; box-shadow:0 1px 1px rgba(0,0,0,.2); cursor:grab; }
  .tl-bar.sub { top:4px; height:15px; line-height:15px; font-size:9px; }
  .tl-bar.crit { background:var(--crit); }
  .tl-bar.manual { outline:2px solid #f59e0b; outline-offset:1px; }
  .tl-bar:active,.tl-bar.dragging { cursor:grabbing; opacity:.85; z-index:9; }
  .tl-resize { position:absolute; top:0; right:0; bottom:0; width:7px; cursor:ew-resize; background:rgba(255,255,255,.0); }
  .tl-resize:hover, .tl-resize.resizing { background:rgba(255,255,255,.55); }
  .tl-bar.resizing { opacity:.9; z-index:9; }
  .tl-mc { position:absolute; top:0; bottom:0; border-left:2px dashed #16a34a; z-index:3; pointer-events:none; }
  .tl-mc-lab { position:absolute; top:36px; font-size:9px; color:#16a34a; background:#fff; padding:0 3px; z-index:3; }
  .tl-ctrl { display:flex; gap:16px; align-items:center; margin-bottom:8px; flex-wrap:wrap; }
  .tl-ctrl .zoom { display:flex; align-items:center; gap:6px; font-size:12px; color:#475569; }
  .tl-legend { display:flex; gap:14px; align-items:center; font-size:11px; color:#64748b; }
  .tl-legend .sw { display:inline-block; width:11px; height:11px; border-radius:3px; margin-right:4px; vertical-align:-1px; }
  /* --- aesthetic polish (additive) --- */
  aside { background:linear-gradient(180deg,#143a5c 0%,#0f2a43 100%); }
  aside .brand b { letter-spacing:.2px; }
  nav button { transition:background .12s ease; border-left:3px solid transparent; }
  nav button.active { border-left-color:#5b9bd5; }
  header { box-shadow:0 1px 3px rgba(15,42,67,.05); z-index:2; }
  .btn { transition:background .12s ease, box-shadow .12s ease, transform .05s ease; box-shadow:0 1px 2px rgba(31,78,120,.22); }
  .btn:active { transform:translateY(1px); }
  .btn.ghost { box-shadow:none; }
  .card { transition:box-shadow .15s ease, transform .15s ease; }
  .card:hover { box-shadow:0 6px 16px rgba(15,42,67,.09); transform:translateY(-1px); }
  a.btn { text-decoration:none; display:inline-block; }
  /* --- resources module --- */
  .subtabs { display:flex; gap:4px; margin:4px 0 16px; border-bottom:1px solid #e2e8f0; }
  .subtabs button { background:none; border:0; border-bottom:2px solid transparent; padding:9px 14px; font-size:13px; color:#64748b; cursor:pointer; }
  .subtabs button:hover { color:#334155; }
  .subtabs button.active { color:var(--epc); border-bottom-color:var(--epc); font-weight:600; }
  td.num, th.num { text-align:right; font-variant-numeric:tabular-nums; }
  .tag { font-size:10px; padding:1px 8px; border-radius:10px; font-weight:600; white-space:nowrap; }
  .tag.rental { background:#fef3c7; color:#92400e; } .tag.owned { background:#dcfce7; color:#166534; }
  .cat-Consumable { background:#e0f2fe; color:#075985; }
  .cat-Tool { background:#ede9fe; color:#5b21b6; }
  .cat-Equipment { background:#ffedd5; color:#9a3412; }
  .form-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(160px,1fr)); gap:9px; align-items:end; }
  .form-grid label { font-size:11px; color:#64748b; display:flex; flex-direction:column; gap:3px; }
  .form-grid input, .form-grid select { width:100%; }
  .icon-btn { background:none; border:0; cursor:pointer; color:#94a3b8; font-size:13px; padding:2px 6px; border-radius:4px; transition:background .1s, color .1s; }
  .icon-btn:hover { background:#f1f5f9; color:#dc2626; }
  .icon-btn.edit:hover { color:var(--epc); }
</style>
</head>
<body>
<div class="app">
  <aside>
    <div class="brand"><b>GPT-3/4 Gas Processing Train</b><small>Pre-Commissioning Tracker &amp; Visualizer</small></div>
    <nav id="nav"></nav>
    <div class="foot" id="aifoot">AI: …</div>
  </aside>
  <main>
    <header>
      <div>
        <div class="title">GPT-3/4 Gas Processing Train</div>
        <div class="sub">Pre-Commissioning Tracker &amp; Visualizer</div>
      </div>
      <span class="spacer"></span>
      <label class="pmcc">PMCC
        <select id="pmccSel" onchange="setPmcc(this.value)"></select>
      </label>
      <button class="btn" onclick="recompute()">↻ Recalculate</button>
    </header>
    <section class="view" id="view"></section>
  </main>
</div>
<script>
const TABS = ["Dashboard","Data","PMCCs","Network","Timeline","Gantt","Circuits","Resources","Logic","Exports","AI"];
const NEEDS_DATA = new Set(["Dashboard","PMCCs","Network","Timeline","Gantt","Circuits"]);
let current = "Dashboard";
let pmcc = "";          // "" = all PMCCs
let PMCCS = [];
let tlPxDay = 6;              // timeline horizontal zoom (px per day)
let tlExpanded = new Set();   // PMCC "no"s currently expanded inline
let tlDetail = {};            // pmcc_no -> cached circuits/activities detail

async function api(method, path, body){
  const r = await fetch(path,{method,headers: body?{"Content-Type":"application/json"}:undefined,body:body?JSON.stringify(body):undefined});
  if(!r.ok){ throw new Error(r.status+": "+await r.text()); }
  const ct=r.headers.get("content-type")||""; return ct.includes("json")? r.json(): r.text();
}
function el(html){ const d=document.createElement("div"); d.innerHTML=html.trim(); return d.firstChild; }
function esc(s){ return (s==null?"":String(s)).replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c])); }
function pcls(p){ return "p-"+(p||"").replace("-",""); }
function q(){ return pmcc? ("?pmcc="+encodeURIComponent(pmcc)) : ""; }

function renderNav(){
  const nav=document.getElementById("nav"); nav.innerHTML="";
  TABS.forEach(t=>{ const b=el(`<button>${t}</button>`); b.className=t===current?"active":""; b.onclick=()=>{current=t;renderNav();render();}; nav.appendChild(b); });
}
function setPmcc(v){ pmcc=v; render(); }
async function recompute(){ await api("GET","/api/schedule/compute"); render(); }
async function refreshPmccList(){
  PMCCS=await api("GET","/api/pmccs");
  const sel=document.getElementById("pmccSel");
  if(sel) sel.innerHTML=`<option value="">All PMCCs</option>`+PMCCS.map(p=>`<option value="${p.no}">${p.no} · ${esc(p.description).slice(0,32)}</option>`).join("");
}

function renderEmptyHint(v){
  v.innerHTML=`<h1>${esc(current)}</h1>
    <div class="hint">
      <b>No commissioning data yet.</b> This app starts blank — head to the <b>Data</b> tab to
      download the CSV template, fill it in, and upload it (or load the GPT-3/4 sample data to explore first).
      <div style="margin-top:10px"><button class="btn" onclick="current='Data';renderNav();render();">Go to Data tab</button></div>
    </div>`;
}

async function render(){
  const v=document.getElementById("view");
  if(NEEDS_DATA.has(current) && PMCCS.length===0) return renderEmptyHint(v);
  if(current==="Dashboard") return renderDashboard(v);
  if(current==="Data") return renderData(v);
  if(current==="PMCCs") return renderPMCCs(v);
  if(current==="Network") return renderNetwork(v);
  if(current==="Timeline") return renderTimeline(v);
  if(current==="Gantt") return renderGantt(v);
  if(current==="Circuits") return renderCircuits(v);
  if(current==="Resources") return renderResources(v);
  if(current==="Logic") return renderLogic(v);
  if(current==="Exports") return renderExports(v);
  if(current==="AI") return renderAI(v);
}

let dashFilter=null; // null | 'completed' | 'in_progress' | 'pending' | 'critical'
function dashSetFilter(f){ dashFilter = (dashFilter===f? null : f); render(); }
function dashGoCircuits(){ current="Circuits"; renderNav(); render(); }

async function renderDashboard(v){
  const s=await api("GET","/api/summary"+q());
  const val=await api("GET","/api/validate"+q());
  const readiness=s.total_activities? Math.round(s.completed/s.total_activities*100):0;
  const scope = pmcc? esc(pmcc) : "All PMCCs";
  v.innerHTML="";
  v.appendChild(el(`<div><h1>${esc(s.project.name)} — ${scope}</h1>
    <div class="muted">${esc(s.project.client)} · Mechanical Completion ${esc(s.project.mechanical_completion_date)} · Planned Startup ${esc(s.project.planned_startup_date)}</div></div>`));
  const cards=el(`<div class="cards"></div>`);
  const cardDefs=[
    ["Circuits",s.circuits,"",()=>dashGoCircuits(),"Open the Circuits tab"],
    ["Activities",s.total_activities,"",()=>dashSetFilter(null),"Show all activities"],
    ["Completed",s.completed,"",()=>dashSetFilter('completed'),"Show only Completed activities"],
    ["In Progress",s.in_progress,"",()=>dashSetFilter('in_progress'),"Show only In Progress activities"],
    ["Pending",s.pending,"",()=>dashSetFilter('pending'),"Show only Pending (Not Started / On Hold) activities"],
    ["Critical",s.critical,"crit",()=>dashSetFilter('critical'),"Show only critical-path activities"],
    ["Readiness %",readiness,"",()=>dashSetFilter('completed'),"Show Completed activities (what's driving readiness)"],
  ];
  cardDefs.forEach(([l,n,c,fn,title],i)=>{
    const active = (l==="Completed"&&dashFilter==='completed')||(l==="In Progress"&&dashFilter==='in_progress')||
      (l==="Pending"&&dashFilter==='pending')||(l==="Critical"&&dashFilter==='critical');
    const card=el(`<div class="card" style="cursor:pointer;${active?'outline:2px solid var(--epc)':''}" title="${esc(title)}"><div class="num ${c}">${n}</div><div class="lbl">${l}</div></div>`);
    card.onclick=fn;
    cards.appendChild(card);
  });
  v.appendChild(cards);
  if(val.errors.length||val.warnings.length){
    const p=el(`<div class="panel"><h2>Network Validation (${scope})</h2></div>`);
    val.errors.slice(0,8).forEach(e=>p.appendChild(el(`<div class="err">✕ ${esc(e)}</div>`)));
    val.warnings.slice(0,8).forEach(w=>p.appendChild(el(`<div class="warn">⚠ ${esc(w)}</div>`)));
    if(val.warnings.length>8) p.appendChild(el(`<div class="muted">…and ${val.warnings.length-8} more</div>`));
    v.appendChild(p);
  }
  let filtered=s.activities;
  if(dashFilter==='completed') filtered=filtered.filter(a=>a.status==='Completed');
  else if(dashFilter==='in_progress') filtered=filtered.filter(a=>a.status==='In Progress');
  else if(dashFilter==='pending') filtered=filtered.filter(a=>a.status!=='Completed'&&a.status!=='In Progress');
  else if(dashFilter==='critical') filtered=filtered.filter(a=>a.is_critical);
  if(dashFilter){
    v.appendChild(el(`<div class="row" style="margin-bottom:8px"><span class="muted">Filtered: <b>${dashFilter.replace('_',' ')}</b> (${filtered.length})</span>
      <button class="btn ghost" onclick="dashSetFilter(null)">Clear filter</button></div>`));
  }
  const rows=filtered.slice(0,400).map(a=>`<tr class="${a.is_critical?'crit':''}">
    <td>${a.is_critical?'<span class="dot">●</span> ':''}<b>${esc(a.activity_id)}</b></td>
    <td>${esc(a.name)}</td><td>${a.duration}d</td><td>${esc(a.start_date)||'—'}</td>
    <td>${esc(a.finish_date)||'—'}</td><td>${a.total_float??'—'}</td><td>${esc(a.status)}</td></tr>`).join("");
  v.appendChild(el(`<div class="panel" style="padding:0;overflow:hidden"><table>
    <thead><tr><th>Activity ID</th><th>Activity</th><th>Dur</th><th>Start</th><th>Finish</th><th>Float</th><th>Status</th></tr></thead>
    <tbody>${rows}</tbody></table></div>`));
  if(filtered.length>400) v.appendChild(el(`<div class="muted">Showing first 400 of ${filtered.length}. Filter by a PMCC to narrow down.</div>`));
}

let dataImportResult=null;
const WEEKDAY_LABELS=[[1,"Mon"],[2,"Tue"],[3,"Wed"],[4,"Thu"],[5,"Fri"],[6,"Sat"],[7,"Sun"]];

async function renderData(v){
  const proj=await api("GET","/api/project");
  const wd=new Set(proj.working_weekdays||[1,2,3,4,5,6,7]);
  v.innerHTML="";
  v.appendChild(el(`<h1>Data</h1><div class="muted" style="margin-bottom:12px">This app starts completely blank. Set up your project, then download the CSV template, fill it in with your own PMCCs/circuits, and upload it — that replaces whatever is currently loaded. Sample data is optional.</div>`));

  const proj_p=el(`<div class="panel">
    <h2>Project Setup</h2>
    <div class="row" style="margin-bottom:8px">
      <label class="muted">Name <input id="dpName" value="${esc(proj.name)}" style="min-width:220px"></label>
      <label class="muted">Client <input id="dpClient" value="${esc(proj.client||'')}"></label>
      <label class="muted">Location <input id="dpLoc" value="${esc(proj.location||'')}"></label>
    </div>
    <div class="row" style="margin-bottom:8px">
      <label class="muted">Mechanical Completion <input id="dpMC" type="date" value="${esc(proj.mechanical_completion_date||'')}"></label>
      <label class="muted">Planned Startup <input id="dpStartup" type="date" value="${esc(proj.planned_startup_date||'')}"></label>
    </div>
    <div class="row" style="margin-bottom:8px">
      <span class="muted">Working days:</span>
      ${WEEKDAY_LABELS.map(([n,lbl])=>`<label class="muted"><input type="checkbox" class="dpWd" value="${n}" ${wd.has(n)?'checked':''}> ${lbl}</label>`).join("")}
    </div>
    <button class="btn" onclick="dataSaveProject()">Save Project Setup</button>
  </div>`);
  v.appendChild(proj_p);

  const tmpl_p=el(`<div class="panel">
    <h2>CSV Template &amp; Upload</h2>
    <div class="muted" style="margin-bottom:8px">One flat CSV drives everything: PMCCs, circuits, priorities and PMCC-to-PMCC / circuit-to-circuit dependencies. Download the template, fill it in (delete the example rows), then upload — this <b>replaces all current data</b>.</div>
    <div class="row" style="margin-bottom:10px">
      <a class="btn" href="/api/template/csv">Download CSV Template</a>
      <a class="btn ghost" href="/api/export/template-csv">Export Current Data as CSV</a>
    </div>
    <div class="row">
      <input type="file" id="dpFile" accept=".csv">
      <button class="btn" onclick="dataUpload()">Upload &amp; Replace All Data</button>
    </div>
    <div id="dpResult" style="margin-top:10px"></div>
  </div>`);
  v.appendChild(tmpl_p);
  if(dataImportResult) renderImportResult(tmpl_p.querySelector("#dpResult"), dataImportResult);

  v.appendChild(el(`<div class="panel">
    <h2>Sample Data &amp; Reset</h2>
    <div class="row">
      <button class="btn ghost" onclick="dataLoadSample()">Load Sample Data (GPT-3/4, 21 PMCCs)</button>
      <button class="btn ghost" onclick="dataClearAll()">Clear All Data</button>
    </div>
  </div>`));
}

function renderImportResult(host, r){
  if(!host) return;
  const dupWarnings=r.warnings.filter(w=>w.includes("duplicate"));
  const otherWarnings=r.warnings.filter(w=>!w.includes("duplicate"));
  let html="";
  if(r.ok){
    html+=`<div style="color:#15803d;font-weight:600">✓ Imported ${r.pmccs} PMCCs · ${r.circuits} circuits · ${r.buildings} building blocks · ${r.activities} activities</div>`;
  } else {
    html+=`<div class="err" style="font-weight:600">✕ Import failed — no data was changed</div>`;
  }
  r.errors.forEach(e=>html+=`<div class="err">✕ ${esc(e)}</div>`);
  if(dupWarnings.length){
    html+=`<div style="margin-top:6px;background:#fff3ee;border:1px solid #fbb99a;border-radius:8px;padding:8px">
      <b style="color:#b3411f">Duplicate rows skipped (${dupWarnings.length}):</b>
      ${dupWarnings.map(w=>`<div class="warn" style="background:#ffe4d5;border-radius:4px;padding:2px 6px;margin-top:3px">${esc(w)}</div>`).join("")}
    </div>`;
  }
  otherWarnings.forEach(w=>html+=`<div class="warn">⚠ ${esc(w)}</div>`);
  host.innerHTML=html;
}

async function dataSaveProject(){
  const working_weekdays=[...document.querySelectorAll(".dpWd:checked")].map(el=>Number(el.value));
  await api("PUT","/api/project",{
    name:document.getElementById("dpName").value,
    client:document.getElementById("dpClient").value,
    location:document.getElementById("dpLoc").value,

function wrapText2(s,maxLen){
  s=s||""; if(s.length<=maxLen) return [s,""];
  let cut=s.lastIndexOf(" ",maxLen); if(cut<0) cut=maxLen;
  return [s.slice(0,cut), s.slice(cut+1,cut+1+maxLen)+(s.length>cut+1+maxLen?"…":"")];
}

async function renderNetworkOverview(v){
  const data=await api("GET","/api/timeline");
  const rows=data.pmcc_rows;
  const W=205,H=96,GX=232,GY=124,cols=5,padX=24,padY=54;
  const cats=["Non-Process","Utility","Process"];
  const byCat={}; cats.forEach(c=>byCat[c]=[]);
  rows.forEach(r=>{ (byCat[r.category]=byCat[r.category]||(byCat[r.category]=[])).push(r); });
  const catOrder=[...cats.filter(c=>byCat[c]&&byCat[c].length), ...Object.keys(byCat).filter(c=>!cats.includes(c)&&byCat[c].length)];

  const pos={}; // no -> {x,y}
  let cards="", labels="", yCursor=padY;
  catOrder.forEach(cat=>{
    const items=byCat[cat];
    labels+=`<text x="${padX}" y="${yCursor-16}" font-size="12.5" font-weight="700" fill="#1F4E78">${esc(cat)}</text>`;
    const rowsInCat=Math.ceil(items.length/cols);
    items.forEach((r,i)=>{
      const x=padX+(i%cols)*GX, y=yCursor+Math.floor(i/cols)*GY;
      pos[r.no]={x,y};
      const stroke=r.critical?"#e4572e":"#cbd5e1", head=r.critical?"#b3411f":"#1f4e78";
      const [l1,l2]=wrapText2(r.description,24);
      cards+=`<g class="net-pmcc" data-no="${esc(r.no)}" style="cursor:pointer">
        <rect x="${x}" y="${y}" width="${W}" height="${H}" rx="9" fill="#fff" stroke="${stroke}" stroke-width="${r.critical?2:1}"/>
        <rect x="${x}" y="${y}" width="${W}" height="22" rx="9" fill="${head}"/><rect x="${x}" y="${y+11}" width="${W}" height="11" fill="${head}"/>
        <text x="${x+9}" y="${y+16}" fill="#fff" font-size="12" font-weight="700">${esc(r.no)}${r.priority?(' · P'+r.priority):''}</text>
        <text x="${x+9}" y="${y+37}" font-size="10.5" fill="#334155">${esc(l1)}</text>
        <text x="${x+9}" y="${y+50}" font-size="10.5" fill="#334155">${esc(l2)}</text>
        <text x="${x+9}" y="${y+68}" font-size="10" fill="#64748b">${r.activities} activities${r.manual?' · adjusted':''}</text>
        <text x="${x+9}" y="${y+84}" font-size="10" fill="#64748b">${esc(r.start)} → ${esc(r.finish)}</text>
      </g>`;
    });
    yCursor += rowsInCat*GY + 48;
  });

  // connectors: draw an arrow from every dependency PMCC to each PMCC that depends on it
  let lines="";
  rows.forEach(r=>{
    (r.depends_on||[]).forEach(dep=>{
      const a=pos[dep], b=pos[r.no];
      if(!a||!b) return;
      const x1=a.x+W, y1=a.y+H/2, x2=b.x, y2=b.y+H/2;
      const mx=(x1+x2)/2;
      const path = (Math.abs(y1-y2)<2) ? `M${x1},${y1} L${x2},${y2}` : `M${x1},${y1} H${mx} V${y2} H${x2}`;
      lines+=`<path d="${path}" fill="none" stroke="#c2410c" stroke-width="1.6" stroke-dasharray="4 2" marker-end="url(#arrow2)"/>`;
    });
  });

  const svgW=padX*2+cols*GX, svgH=yCursor+20;
  v.innerHTML=`<h1>Visual Logic Network — All PMCCs</h1>
    <div class="muted" style="margin-bottom:8px">${rows.length} PMCCs grouped by category (Non-Process / Utility / Process). Dashed orange arrows show real PMCC-to-PMCC dependencies (from your CSV's <code>depends_on</code> links) — these drive actual scheduling constraints, not just the picture. Click a PMCC to drill into its circuits. Drag the background to pan.</div>
    <div class="panel pannable" id="netPan" style="overflow:auto;max-height:76vh;cursor:grab"><svg width="${svgW}" height="${svgH}">
      <defs><marker id="arrow2" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L7,3 L0,6 Z" fill="#c2410c"/></marker></defs>
      ${labels}${lines}${cards}
    </svg></div>`;
  v.querySelectorAll(".net-pmcc").forEach(g=>g.addEventListener("click",()=>{
    pmcc=g.dataset.no; const sel=document.getElementById("pmccSel"); if(sel) sel.value=pmcc; render();
  }));
  initPan(document.getElementById("netPan"));
}

// generic drag-to-pan for any scrollable .pannable container (network diagrams)
function initPan(container){
  if(!container) return;
  let panning=false, sx=0, sy=0, sl=0, st=0;
  container.addEventListener("mousedown", e=>{
    if(e.target.closest(".net-pmcc")) return; // don't hijack node clicks in the overview
    panning=true; sx=e.pageX; sy=e.pageY; sl=container.scrollLeft; st=container.scrollTop;
    container.style.cursor="grabbing";
  });
  window.addEventListener("mousemove", e=>{
    if(!panning) return;
    container.scrollLeft=sl-(e.pageX-sx);
    container.scrollTop=st-(e.pageY-sy);
  });
  window.addEventListener("mouseup", ()=>{ panning=false; container.style.cursor="grab"; });
}

async function renderNetwork(v){
  if(!pmcc) return renderNetworkOverview(v);
  const net=await api("GET","/api/network"+q());
  const W=190,H=78,padX=130,padY=16,GX=215,LANE=96,CGAP=28;
  // adjacency for per-circuit DAG layout
  const succ={}; net.nodes.forEach(n=>succ[n.id]=[]);
  net.edges.forEach(e=>{ if(succ[e.source]) succ[e.source].push(e.target); });
  // group nodes by circuit, preserving first-seen order
  const order=[]; const groups={};
  net.nodes.forEach(n=>{ const c=n.data.circuit; if(!groups[c]){groups[c]=[];order.push(c);} groups[c].push(n.id); });
  const pos={}; const rowLabels=[]; let yCursor=padY; let maxRank=0;
  order.forEach(c=>{
    const ids=groups[c]; const inSub=new Set(ids);
    const preds={}; ids.forEach(i=>preds[i]=[]);
    ids.forEach(i=>(succ[i]||[]).forEach(j=>{ if(inSub.has(j)) preds[j].push(i); }));
    const rank={}; ids.forEach(i=>rank[i]=0);
    for(let it=0; it<ids.length+2; it++){ let ch=false;
      ids.forEach(i=>preds[i].forEach(p=>{ if(rank[p]+1>rank[i]){rank[i]=rank[p]+1; ch=true;} }));
      if(!ch) break; }
    const lane={};
    ids.forEach(i=>{ const r=rank[i]; lane[r]=(lane[r]||0); pos[i]={x:padX+r*GX, y:yCursor+lane[r]*LANE, rank:r}; lane[r]++; maxRank=Math.max(maxRank,r); });
    const usedLanes=Math.max(...Object.values(lane));
    rowLabels.push({y:yCursor, c});
    yCursor += usedLanes*LANE + CGAP;
  });
  const svgW=padX+(maxRank+1)*GX+20, svgH=yCursor+20;
  const labels=rowLabels.map(r=>`<text x="6" y="${r.y+14}" font-size="10" font-weight="600" fill="#334155">${esc(r.c)}</text>`).join("");
  // orthogonal connectors
  const lines=net.edges.map(e=>{ const a=pos[e.source],b=pos[e.target]; if(!a||!b)return"";
    const x1=a.x+W,y1=a.y+H/2,x2=b.x,y2=b.y+H/2; const mx=(x1+x2)/2;
    return `<path d="M${x1},${y1} H${mx} V${y2} H${x2}" fill="none" stroke="#7c8aa0" stroke-width="1.3" marker-end="url(#arrow)"/>`;}).join("");
  const cards=net.nodes.map(n=>{ const d=n.data,x=pos[n.id].x,y=pos[n.id].y;
    const stroke=d.isCritical?"#e4572e":"#cbd5e1",head=d.isCritical?"#b3411f":"#1f4e78";
    return `<g><rect x="${x}" y="${y}" width="${W}" height="${H}" rx="8" fill="#fff" stroke="${stroke}" stroke-width="${d.isCritical?2:1}"/>
      <rect x="${x}" y="${y}" width="${W}" height="20" rx="8" fill="${head}"/><rect x="${x}" y="${y+10}" width="${W}" height="10" fill="${head}"/>
      <text x="${x+8}" y="${y+14}" fill="#fff" font-size="11" font-weight="600">${esc(d.name).slice(0,24)}</text>
      <text x="${x+W-8}" y="${y+14}" fill="#fff" font-size="10" text-anchor="end">${d.duration}d</text>
      <text x="${x+8}" y="${y+36}" font-size="10" fill="#334155">${esc(d.discipline)}</text>
      <text x="${x+8}" y="${y+52}" font-size="10" fill="#64748b">${esc(d.startDate)||'—'} → ${esc(d.finishDate)||'—'}</text>
      <text x="${x+8}" y="${y+68}" font-size="10" fill="#64748b">Float ${d.totalFloat??'—'} · Prio ${esc(d.priority)}</text></g>`;}).join("");
  v.innerHTML=`<h1>Visual Logic Network — ${esc(pmcc)} <a href="#" onclick="pmcc='';document.getElementById('pmccSel').value='';render();return false;" style="font-size:12px;font-weight:400;color:var(--epc)">← All PMCCs</a></h1>
    <div class="muted" style="margin-bottom:8px">${net.nodes.length} activities across ${order.length} circuits. Each circuit is a precedence network — parallel Leak Test / Loop Check branches — drawn with orthogonal connectors. Critical path in orange. Drag the background to pan.</div>
    <div class="panel" id="circPan" style="overflow:auto;max-height:72vh;cursor:grab">
      <svg width="${svgW}" height="${svgH}">
        <defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L7,3 L0,6 Z" fill="#7c8aa0"/></marker></defs>
        ${labels}${lines}${cards}
      </svg></div>`;
  initPan(document.getElementById("circPan"));
}

  const min=allDates.reduce((a,b)=>a<b?a:b), max=allDates.reduce((a,b)=>a>b?a:b);

      <div class="tl-bar ${r.critical?'crit':''} ${r.manual?'manual':''}" data-kind="pmcc" data-no="${esc(r.no)}" data-start="${r.start}" data-finish="${r.finish}"
        style="left:${leftW+l*px}px;width:${w}px" title="${esc(r.no)} — ${esc(r.description)}&#10;${r.start} to ${r.finish} (${r.activities} activities)&#10;Drag the middle to shift the whole PMCC · drag the right edge to compress/stretch its schedule.">${esc(r.no)}<div class="tl-resize" data-kind="pmcc" data-no="${esc(r.no)}"></div></div></div>`;
    if(expanded){

          rowsHtml+=`<div class="tl-row sub" style="width:${fullW}px"><span class="tl-lab sub" style="font-weight:600">${esc(c.code)}</span></div>`;
          c.activities.filter(a=>a.start&&a.finish).forEach(a=>{

            rowsHtml+=`<div class="tl-row sub" style="width:${fullW}px">

                style="left:${leftW+al*px}px;width:${aw}px" title="${esc(a.name)} (${esc(a.discipline)})&#10;${a.start} to ${a.finish} · ${a.duration}d · float ${a.float}&#10;Drag the middle to reschedule · drag the right edge to change duration.">${esc(a.name).slice(0,18)}<div class="tl-resize" data-kind="activity" data-id="${a.id}"></div></div></div>`;

// --- drag handling: one set of listeners for the whole page (re-render swaps
// the DOM each time, so listeners live at the document level, not per-render).
// Two independent gestures on the same bar: dragging its body MOVES it (start
// date), dragging the thin handle on its right edge RESIZES it (duration). ---
let tlDrag=null, tlResize=null;
document.addEventListener("mousedown", e=>{
  if(current!=="Timeline") return;
  const handle=e.target.closest(".tl-resize");
  if(handle){
    e.preventDefault(); e.stopPropagation();
    const bar=handle.closest(".tl-bar");
    tlResize={ el:bar, kind:handle.dataset.kind, id:handle.dataset.id, no:handle.dataset.no,
      startWidth:parseFloat(bar.style.width), startX:e.pageX, moved:0 };
    bar.classList.add("resizing"); handle.classList.add("resizing");
    return;
  }
  const bar=e.target.closest(".tl-bar");
  if(!bar) return;
  e.preventDefault();
  tlDrag={ el:bar, kind:bar.dataset.kind, id:bar.dataset.id, no:bar.dataset.no,
    startLeft:parseFloat(bar.style.left), startX:e.pageX, moved:0 };
  bar.classList.add("dragging");
});
document.addEventListener("mousemove", e=>{
  if(tlResize){
    tlResize.moved=e.pageX-tlResize.startX;
    tlResize.el.style.width=Math.max(4, tlResize.startWidth+tlResize.moved)+"px";
    return;
  }
  if(tlDrag){
    tlDrag.moved=e.pageX-tlDrag.startX;
    tlDrag.el.style.left=(tlDrag.startLeft+tlDrag.moved)+"px";
  }
});
document.addEventListener("mouseup", async ()=>{
  if(tlResize){
    const d=tlResize; tlResize=null;
    d.el.classList.remove("resizing");
    document.querySelectorAll(".tl-resize.resizing").forEach(h=>h.classList.remove("resizing"));
    const deltaDays=Math.round(d.moved/tlPxDay);
    if(deltaDays!==0){
      try{
        if(d.kind==="activity"){
          const oldDur=parseFloat(d.el.dataset.duration)||1;
          const newDur=Math.max(1, oldDur+deltaDays);
          await api("PUT", `/api/activities/${d.id}`, {duration:newDur});
        } else {
          const start=new Date(d.el.dataset.start+"T00:00:00"), finish=new Date(d.el.dataset.finish+"T00:00:00");
          const oldSpanDays=Math.round((finish-start)/86400000)+1;
          const factor=Math.max(0.2, (oldSpanDays+deltaDays)/oldSpanDays);
          await api("POST", `/api/pmcc/${encodeURIComponent(d.no)}/scale-duration`, {factor});
        }
      } catch(err){ alert(err.message); }
      tlDetail={};
    }
    render();
    return;
  }
  if(!tlDrag) return;
  const d=tlDrag; tlDrag=null;
  d.el.classList.remove("dragging");
  const deltaDays=Math.round(d.moved/tlPxDay);
  if(deltaDays===0){ if(d.kind==="pmcc") tlToggle(d.no); return; }
  try{
    if(d.kind==="pmcc"){
      await api("POST", `/api/pmcc/${encodeURIComponent(d.no)}/finish`, {finish: addDays(d.el.dataset.finish, deltaDays)});
    } else {
      await api("POST", `/api/activities/${d.id}/reschedule`, {start: addDays(d.el.dataset.start, deltaDays)});
    }
  } catch(err){ alert(err.message); }
  tlDetail={};
  render();
});

async function renderGantt(v){
  if(!pmcc){ v.innerHTML=`<h1>Gantt Chart</h1><div class="hint">Select a PMCC from the top-right dropdown to view its Gantt. (1,150+ activities is too many to chart at once.)</div>`; return; }
  const s=await api("GET","/api/summary"+q());
  const acts=s.activities.filter(a=>a.start_date&&a.finish_date);
  if(!acts.length){ v.innerHTML="<h1>Gantt</h1><div class='muted'>No scheduled activities.</div>"; return; }
  const DAY=86400000;
  const min=Math.min(...acts.map(a=>+new Date(a.start_date)));
  const max=Math.max(...acts.map(a=>+new Date(a.finish_date)));
  const totalDays=Math.round((max-min)/DAY)+1, cw=18;
  const rows=acts.map(a=>{ const off=Math.round((+new Date(a.start_date)-min)/DAY);
    const span=Math.round((+new Date(a.finish_date)-+new Date(a.start_date))/DAY)+1;
    return `<div class="gantt-row"><div class="gantt-label" title="${esc(a.activity_id)}">${a.is_critical?'<span class="dot">●</span> ':''}${esc(a.activity_id)}</div>
      <div class="gantt-track"><div class="gantt-bar ${a.is_critical?'crit':''}" style="left:${off*cw}px;width:${Math.max(span*cw-2,6)}px" title="${esc(a.name)}: ${esc(a.start_date)}→${esc(a.finish_date)}">${esc(a.name).slice(0,16)}</div></div></div>`;}).join("");
  v.innerHTML=`<h1>Gantt Chart — ${esc(pmcc)}</h1><div class="muted" style="margin-bottom:6px">${acts.length} activities · ${totalDays} calendar-day span · backward-scheduled to Mechanical Completion ${esc(s.project.mechanical_completion_date)}.</div>
    <div class="panel" style="overflow:auto;max-height:74vh;min-width:${230+totalDays*cw}px">${rows}</div>`;
}

async function renderCircuits(v){
  const subs=await api("GET","/api/subsystems"+q());
  if(!subs.length){ v.innerHTML=`<h1>Commissioning Circuits</h1><div class="hint">This PMCC has no detailed circuits in the dataset yet (e.g. building PMCCs). Select a process/utility PMCC.</div>`; return; }
  const rows=subs.map(sObj=>`<tr><td><b>${esc(sObj.code)}</b></td><td>${esc(sObj.description)}</td>
    <td><span class="pill ${pcls(sObj.priority)}">${esc(sObj.priority)}</span></td>
    <td>${esc(sObj.special)||'<span class="muted">— standard set —</span>'}</td><td>${esc(sObj.pmcc_no)}</td></tr>`).join("");
  v.innerHTML=`<h1>Commissioning Circuits${pmcc?(' — '+esc(pmcc)):''}</h1>
    <div class="muted" style="margin-bottom:10px">${subs.length} items. Each circuit carries its special pre-commissioning activity plus the standard set: Layup Witness · Vessel Inspection &amp; Box-up (if any) · Reinstatement · Leak Test (Dry Air) · Inertization · Loop Check · No-Load Test (if motors) · Punch Point Liquidation. Building PMCCs appear as a single 30-45 day handover block.</div>
    <div class="panel" style="padding:0;overflow:hidden"><table>
      <thead><tr><th>Circuit / Sub-system</th><th>Description</th><th>Priority</th><th>Special Pre-Com Activity</th><th>PMCC</th></tr></thead>
      <tbody>${rows}</tbody></table></div>`;
}

async function renderLogic(v){
  const rules=await api("GET","/api/logic-rules");
  const items=rules.map(r=>`<div class="panel" style="display:flex;justify-content:space-between;margin-bottom:8px">
    <div><b style="color:var(--epc)">IF</b> ${esc(r.condition)} <b style="color:var(--epc)">THEN</b> ${esc(r.action)}</div>
    <button class="btn ghost" onclick="delRule(${r.id})">✕</button></div>`).join("");
  v.innerHTML=`<h1>No-Code Logic Engine</h1><div class="muted" style="margin-bottom:10px">Plain-language rules with AND / OR / NOT.</div>
    <div class="panel"><div class="row">
      IF <input id="cond" placeholder="Leak Test Complete AND Nitrogen Available" style="flex:1">
      THEN <input id="act" placeholder="Enable Inertization" style="flex:1">
      <button class="btn" onclick="addRule()">Add</button></div></div>${items}`;
}
async function addRule(){ if(!cond.value.trim())return; await api("POST","/api/logic-rules",{condition:cond.value,action:act.value}); render(); }
async function delRule(id){ await api("DELETE","/api/logic-rules/"+id); render(); }

function renderExports(v){
  v.innerHTML=`<h1>Exports & Reports</h1><div class="muted" style="margin-bottom:14px">Generated offline by the local server${pmcc?(' for '+esc(pmcc)):' (whole train)'}.</div>
    <div class="row">
      <a class="btn" href="/api/export/html${q()}" target="_blank">HTML Dashboard</a>
      <a class="btn" href="/api/export/csv">CSV Schedule (all)</a>
    </div>
    <div class="muted" style="margin-top:14px">Excel (.xlsx) & PDF are available in the full FastAPI build. Primavera XER and the Aramco turnover pack are Phase 2.</div>`;
}

// ---------------- Resources — consumables, tools & tackles, equipment & rental ----------------
let resSub = "Plan";           // Plan | Catalog | Assignments
let resEditId = null;          // catalogue item being edited
let resImportResult = null;
let resActCache = {};          // pmcc_no -> activities (for the assignment picker)
const RES_CATS = ["Consumable","Tool & Tackle","Equipment"];
function catCls(c){ return "cat "+(c==="Tool & Tackle"?"cat-Tool":c==="Equipment"?"cat-Equipment":"cat-Consumable"); }
function fmtMoney(n,cur){ return (cur?cur+" ":"")+(Math.round((n||0)*100)/100).toLocaleString(undefined,{maximumFractionDigits:2}); }
function rval(id){ const e=document.getElementById(id); return e?String(e.value).trim():""; }
function resRerender(){ renderResources(document.getElementById("view")); }

async function renderResources(v){
  const [resources, assignments, plan] = await Promise.all([
    api("GET","/api/resources"),
    api("GET","/api/resource-assignments"),
    api("GET","/api/resource-plan"),
  ]);
  v.innerHTML=`<h1>Resources — Consumables, Tools &amp; Tackles, Equipment &amp; Rental</h1>
    <div class="muted" style="margin-bottom:6px">Plan what each PMCC and activity needs, then roll up the rental cost across the schedule.</div>
    <div class="subtabs" id="resSubs"></div><div id="resBody"></div>`;
  const subs=v.querySelector("#resSubs");
  [["Plan","Plan & Cost"],["Catalog","Catalogue"],["Assignments","Assignments"]].forEach(([key,lbl])=>{
    const b=el(`<button>${lbl}</button>`); b.className=key===resSub?"active":"";
    b.onclick=()=>{resSub=key;resRerender();}; subs.appendChild(b);
  });
  const body=v.querySelector("#resBody");
  if(resSub==="Catalog") return resRenderCatalog(body,resources);
  if(resSub==="Assignments") return resRenderAssignments(body,resources,assignments);
  return resRenderPlan(body,plan);
}

function resRenderCatalog(body, resources){
  const editing = resEditId? resources.find(r=>r.id===resEditId) : null;
  const rows = resources.map(r=>`<tr>
    <td><span class="${catCls(r.category)}">${esc(r.category)}</span></td>
    <td><b>${esc(r.name)}</b>${r.code?` <span class="muted">${esc(r.code)}</span>`:''}</td>
    <td>${esc(r.unit||'')}</td>
    <td><span class="tag ${r.ownership==='Rental'?'rental':'owned'}">${esc(r.ownership)}</span></td>
    <td class="num">${fmtMoney(r.rate,r.currency)}${r.ownership==='Rental'?' <span class="muted">/day</span>':''}</td>
    <td>${esc(r.supplier||'')}</td>
    <td style="text-align:right;white-space:nowrap">
      <button class="icon-btn edit" title="Edit" onclick="resEdit(${r.id})">✎</button>
      <button class="icon-btn" title="Delete" onclick="resDelete(${r.id})">✕</button></td></tr>`).join("")
    || `<tr><td colspan="7" class="muted" style="padding:14px">No catalogue items yet — add one below or import a CSV.</td></tr>`;
  body.innerHTML=`
    <div class="panel" style="padding:0;overflow:hidden"><table>
      <thead><tr><th>Category</th><th>Item</th><th>Unit</th><th>Type</th><th class="num">Rate</th><th>Supplier</th><th></th></tr></thead>
      <tbody>${rows}</tbody></table></div>
    <div class="panel">
      <h2>${editing?'Edit item':'Add catalogue item'}</h2>
      <div class="form-grid">
        <label>Category<select id="rcCat">${RES_CATS.map(c=>`<option ${editing&&editing.category===c?'selected':''}>${c}</option>`).join("")}</select></label>
        <label>Name<input id="rcName" value="${editing?esc(editing.name):''}"></label>
        <label>Code<input id="rcCode" value="${editing?esc(editing.code||''):''}"></label>
        <label>Unit<input id="rcUnit" placeholder="unit / set / Nm3" value="${editing?esc(editing.unit||''):''}"></label>
        <label>Type<select id="rcOwn"><option ${editing&&editing.ownership==='Owned'?'selected':''}>Owned</option><option ${editing&&editing.ownership==='Rental'?'selected':''}>Rental</option></select></label>
        <label>Rate (per day if rental)<input id="rcRate" type="number" step="0.01" value="${editing?editing.rate:''}"></label>
        <label>Currency<input id="rcCur" value="${editing?esc(editing.currency||'USD'):'USD'}"></label>
        <label>Supplier<input id="rcSup" value="${editing?esc(editing.supplier||''):''}"></label>
        <label style="grid-column:1/-1">Notes<input id="rcNotes" value="${editing?esc(editing.notes||''):''}"></label>
      </div>
      <div class="row" style="margin-top:10px">
        <button class="btn" onclick="resSaveCatalog()">${editing?'Save changes':'Add item'}</button>
        ${editing?'<button class="btn ghost" onclick="resEdit(null)">Cancel</button>':''}
      </div>
    </div>
    <div class="panel">
      <h2>Import / Export</h2>
      <div class="row" style="margin-bottom:8px"><a class="btn ghost" href="/api/export/resources-csv">Export Resources CSV</a></div>
      <div class="row"><input type="file" id="rcFile" accept=".csv"><button class="btn" onclick="resImport()">Import CSV</button></div>
      <div class="muted" style="margin-top:6px">Round-trippable: RESOURCE rows are the catalogue, ASSIGNMENT rows link items to a PMCC/activity.</div>
      <div id="rcImportResult" style="margin-top:8px"></div>
    </div>`;
  if(resImportResult){
    const h=body.querySelector("#rcImportResult");
    h.innerHTML = resImportResult.ok
      ? `<div style="color:#15803d;font-weight:600">✓ Imported ${resImportResult.resources_added} items · ${resImportResult.assignments_added} assignments</div>`+(resImportResult.errors||[]).map(e=>`<div class="err">✕ ${esc(e)}</div>`).join("")
      : `<div class="err">✕ ${esc(((resImportResult.errors||['Import failed'])[0]))}</div>`;
  }
}
function resEdit(id){ resEditId=id; resRerender(); }
async function resDelete(id){ if(!confirm("Delete this item and any assignments that use it?"))return; await api("DELETE","/api/resources/"+id); if(resEditId===id)resEditId=null; resRerender(); }
async function resSaveCatalog(){
  const payload={category:rval("rcCat"),name:rval("rcName"),code:rval("rcCode"),unit:rval("rcUnit"),
    ownership:rval("rcOwn"),rate:rval("rcRate"),currency:rval("rcCur"),supplier:rval("rcSup"),notes:rval("rcNotes")};
  if(!payload.name){ alert("Name is required."); return; }
  if(resEditId) await api("PUT","/api/resources/"+resEditId,payload); else await api("POST","/api/resources",payload);
  resEditId=null; resRerender();
}
async function resImport(){
  const f=document.getElementById("rcFile").files[0]; if(!f){ alert("Choose a CSV file first."); return; }
  const text=await f.text();
  try{ resImportResult=await api("POST","/api/import/resources-csv",{csv:text}); }
  catch(e){ resImportResult={ok:false,errors:[String(e)]}; }
  await refreshPmccList(); resRerender();
}

function resRenderAssignments(body, resources, assignments){
  const resById={}; resources.forEach(r=>resById[r.id]=r);
  const rows=assignments.map(a=>{ const r=resById[a.resource_id]||{};
    return `<tr>
      <td><b>${esc(r.name||'—')}</b> <span class="${catCls(r.category)}">${esc(r.category||'')}</span></td>
      <td>${esc(a.scope)}</td><td>${esc(a.pmcc_no||'')}</td>
      <td class="num">${a.quantity} ${esc(r.unit||'')}</td>
      <td>${a.start_date?esc(a.start_date)+' → '+esc(a.finish_date||''):'<span class="muted">from schedule</span>'}</td>
      <td style="text-align:right"><button class="icon-btn" title="Remove" onclick="resDelAssign(${a.id})">✕</button></td></tr>`;}).join("")
    || `<tr><td colspan="6" class="muted" style="padding:14px">No assignments yet.</td></tr>`;
  const noData=PMCCS.length===0;
  body.innerHTML=`
    <div class="panel" style="padding:0;overflow:hidden"><table>
      <thead><tr><th>Resource</th><th>Scope</th><th>PMCC</th><th class="num">Qty</th><th>Window</th><th></th></tr></thead>
      <tbody>${rows}</tbody></table></div>
    <div class="panel">
      <h2>Assign a resource</h2>
      ${resources.length===0?'<div class="muted">Add catalogue items first (Catalogue tab).</div>':
        noData?'<div class="muted">Load or import PMCC data first (Data tab) to assign against a PMCC or activity.</div>':`
      <div class="form-grid">
        <label style="grid-column:1/-1">Resource<select id="raRes">${resources.map(r=>`<option value="${r.id}">${esc(r.name)} — ${esc(r.category)}</option>`).join("")}</select></label>
        <label>Scope<select id="raScope" onchange="resScopeChange()"><option>PMCC</option><option>Activity</option></select></label>
        <label>PMCC<select id="raPmcc" onchange="resPmccChange()">${PMCCS.map(p=>`<option value="${p.no}">${esc(p.no)} · ${esc((p.description||'').slice(0,26))}</option>`).join("")}</select></label>
        <label id="raActWrap" style="display:none">Activity<select id="raAct"></select></label>
        <label>Quantity<input id="raQty" type="number" step="0.01" value="1"></label>
        <label>Start (optional)<input id="raStart" type="date"></label>
        <label>Finish (optional)<input id="raFinish" type="date"></label>
      </div>
      <div class="row" style="margin-top:10px"><button class="btn" onclick="resSaveAssign()">Assign</button>
        <span class="muted">Leave dates blank to inherit the activity/PMCC schedule window.</span></div>`}
    </div>`;
  if(!noData && resources.length) resPmccChange();
}
function resScopeChange(){ const w=document.getElementById("raActWrap"); if(w) w.style.display = rval("raScope")==="Activity"?"":"none"; }
async function resPmccChange(){
  resScopeChange();
  const pno=rval("raPmcc"); if(!pno) return;
  if(!resActCache[pno]) resActCache[pno]=await api("GET","/api/activities?pmcc="+encodeURIComponent(pno));
  const sel=document.getElementById("raAct");
  if(sel) sel.innerHTML=resActCache[pno].map(a=>`<option value="${a.id}">${esc(a.name)}${a.circuit?(' · '+esc(a.circuit)):''}</option>`).join("");
}
async function resSaveAssign(){
  const scope=rval("raScope");
  const payload={resource_id:Number(rval("raRes")),scope,pmcc_no:rval("raPmcc"),quantity:rval("raQty"),start_date:rval("raStart"),finish_date:rval("raFinish")};
  if(scope==="Activity"){ const a=rval("raAct"); if(!a){ alert("Pick an activity."); return; } payload.activity_id=Number(a); }
  await api("POST","/api/resource-assignments",payload); resRerender();
}
async function resDelAssign(id){ await api("DELETE","/api/resource-assignments/"+id); resRerender(); }

function resRenderPlan(body, plan){
  const cur=plan.currency;
  const catRows=plan.by_category.map(c=>`<tr>
      <td><span class="${catCls(c.category)}">${esc(c.category)}</span></td>
      <td class="num">${c.items}</td><td class="num">${fmtMoney(c.cost,cur)}</td></tr>`).join("")
    || `<tr><td colspan="3" class="muted" style="padding:12px">Nothing planned yet.</td></tr>`;
  const resRows=plan.by_resource.map(r=>`<tr>
      <td><b>${esc(r.name)}</b> <span class="muted">${esc(r.code||'')}</span></td>
      <td><span class="${catCls(r.category)}">${esc(r.category)}</span></td>
      <td><span class="tag ${r.ownership==='Rental'?'rental':'owned'}">${esc(r.ownership)}</span></td>
      <td class="num">${r.total_quantity} ${esc(r.unit||'')}</td>
      <td class="num">${r.peak_demand}</td>
      <td class="num">${fmtMoney(r.total_cost,cur)}</td></tr>`).join("")
    || `<tr><td colspan="6" class="muted" style="padding:12px">—</td></tr>`;
  const lineRows=plan.lines.map(l=>`<tr>
      <td>${esc(l.name)}</td><td>${esc(l.scope)}</td>
      <td>${esc(l.pmcc_no)}${l.activity_label?(' · '+esc(l.activity_label)):''}</td>
      <td class="num">${l.quantity} ${esc(l.unit||'')}</td>
      <td>${l.start_date?esc(l.start_date)+' → '+esc(l.finish_date):'<span class="muted">—</span>'}</td>
      <td class="num">${l.is_rental?l.working_days:'—'}</td>
      <td class="num">${fmtMoney(l.cost,l.currency||cur)}</td></tr>`).join("")
    || `<tr><td colspan="7" class="muted" style="padding:12px">No assignments yet — add some on the Assignments tab.</td></tr>`;
  body.innerHTML=`
    <div class="cards">
      <div class="card"><div class="num">${fmtMoney(plan.total_cost,cur)}</div><div class="lbl">Total planned cost</div></div>
      <div class="card"><div class="num crit">${fmtMoney(plan.rental_cost,cur)}</div><div class="lbl">Rental cost</div></div>
      <div class="card"><div class="num">${plan.catalogue_size}</div><div class="lbl">Catalogue items</div></div>
      <div class="card"><div class="num">${plan.assignment_count}</div><div class="lbl">Assignments</div></div>
    </div>
    <div class="panel" style="padding:0;overflow:hidden"><table>
      <thead><tr><th>Category</th><th class="num">Items</th><th class="num">Cost</th></tr></thead><tbody>${catRows}</tbody></table></div>
    <h2 style="margin:16px 0 6px">By resource</h2>
    <div class="panel" style="padding:0;overflow:hidden"><table>
      <thead><tr><th>Resource</th><th>Category</th><th>Type</th><th class="num">Total qty</th><th class="num">Peak</th><th class="num">Cost</th></tr></thead>
      <tbody>${resRows}</tbody></table></div>
    <h2 style="margin:16px 0 6px">Time-phased demand</h2>
    <div class="muted" style="margin-bottom:6px">Windows and working-days come from the backward-CPM schedule; rental cost = rate × qty × working-days.</div>
    <div class="panel" style="padding:0;overflow:hidden"><table>
      <thead><tr><th>Resource</th><th>Scope</th><th>PMCC / Activity</th><th class="num">Qty</th><th>Window</th><th class="num">Days</th><th class="num">Cost</th></tr></thead>
      <tbody>${lineRows}</tbody></table></div>
    <div class="row" style="margin-top:12px"><a class="btn ghost" href="/api/export/resources-csv">Export Resources CSV</a></div>`;
}

let chat=[];
async function renderAI(v){
  const h=await api("GET","/api/health");
  const s=await api("GET","/api/settings");
  v.innerHTML=`<h1>AI Assistant</h1><div class="muted" style="margin-bottom:10px">${h.ai_available?'Claude online — ask about the critical path, PMCC sequencing or bottlenecks.':'Offline — enter a Claude API key below (or set ANTHROPIC_API_KEY) to enable it. Everything else works without it.'}</div>
    <div class="panel">
      <h2>Claude API Key</h2>
      <div class="row">
        <input id="apiKey" type="password" placeholder="${s.anthropic_configured?'●●●●●●●●●●●●●●●● (key saved — enter a new one to replace)':'sk-ant-…'}" style="flex:1;min-width:280px">
        <button class="btn" onclick="saveApiKey()">Save key</button>
        ${s.anthropic_configured?'<button class="btn ghost" onclick="clearApiKey()">Clear</button>':''}
      </div>
      <div class="muted" style="margin-top:6px">Get a key at console.anthropic.com. Stored locally in this app's data folder (data/standalone.json) — not sent anywhere except directly to Anthropic's API when you ask a question.</div>
    </div>
    <div class="panel" style="height:300px;overflow:auto">${chat.map(m=>`<div class="msg ${m.role}">${esc(m.text)}</div>`).join("")||'<div class="muted">Try: “Which PMCC has the most critical activities?”</div>'}</div>
    <div class="row" style="margin-top:8px"><input id="qx" placeholder="Ask the scheduling assistant…" style="flex:1" onkeydown="if(event.key==='Enter')sendAI()"><button class="btn" onclick="sendAI()">Send</button></div>`;
}
async function saveApiKey(){
  const v=document.getElementById("apiKey").value.trim();
  if(!v) return;
  await api("PUT","/api/settings",{anthropic_api_key:v});
  const h=await api("GET","/api/health"); document.getElementById("aifoot").textContent="AI: "+(h.ai_available?"Online":"Offline")+" · standalone";
  render();
}
async function clearApiKey(){
  await api("PUT","/api/settings",{anthropic_api_key:""});
  const h=await api("GET","/api/health"); document.getElementById("aifoot").textContent="AI: "+(h.ai_available?"Online":"Offline")+" · standalone";
  render();
}
async function sendAI(){ const q=document.getElementById("qx").value.trim(); if(!q)return;
  chat.push({role:"user",text:q}); renderAI(document.getElementById("view"));
  try{ const r=await api("POST","/api/ai/chat",{message:q}); chat.push({role:"ai",text:r.reply}); }
  catch(e){ chat.push({role:"ai",text:String(e)}); } renderAI(document.getElementById("view")); }

function applyHash(){
  const parts=decodeURIComponent(location.hash.slice(1)).split("/");
  if(TABS.includes(parts[0])) current=parts[0];
  if(parts[1]!==undefined){ pmcc=parts[1]; const sel=document.getElementById("pmccSel"); if(sel) sel.value=pmcc; }
}
window.addEventListener("hashchange",()=>{ applyHash(); renderNav(); render(); });
(async function init(){
  renderNav();
  try{
    await refreshPmccList();
    const h=await api("GET","/api/health"); document.getElementById("aifoot").textContent="AI: "+(h.ai_available?"Online":"Offline")+" · standalone";
  }catch(e){}
  applyHash();
  renderNav();
  render();
})();
</script>
